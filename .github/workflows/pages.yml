name: Build and deploy PassMan PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build extension and PWA
        # Public Web OAuth client ID; no client secret is used in this static build.
        env:
          PASSMAN_GOOGLE_CLIENT_ID: ${{ vars.PASSMAN_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verify source and web bundle
        run: |
          test -z "$(find . -type f \
            \( -name '*.pm' -o -name '*.csv' \) \
            -not -path './node_modules/*' -not -path './dist/*' -not -path './dist-web/*' \
            -print -quit)"
          test -f dist-web/index.html
          test -f dist-web/manifest.webmanifest
          test -f dist-web/sw.js
          ! grep -RE '\bchrome\.(runtime|storage|identity|alarms)\b' dist-web
          ! grep -RE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ya29\.|client_secret)' dist-web

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
